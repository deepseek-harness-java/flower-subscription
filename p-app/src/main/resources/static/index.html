<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 鲜花订阅管家台 · Flower Subscription</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#fbf7f9; color:#1f2a28; }
  header { background:linear-gradient(135deg,#6d2a52,#d16ba5); color:#fff; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; }
  header .sub { font-size:12px; opacity:.85; margin-top:4px; }
  header .badge { font-size:13px; background:rgba(255,255,255,.15); padding:6px 14px; border-radius:20px; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1240px; margin:0 auto; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(14,77,69,.08); }
  .card h2 { font-size:15px; margin-bottom:12px; color:#6d2a52; }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat div { background:#f7e9f1; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:22px; color:#b34791; margin-top:4px; }
  .stat span { font-size:12px; color:#9a7f92; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .tag.g { background:#e3f4e9; color:#218a58; }
  .tag.y { background:#fdf3e0; color:#c07f16; }
  .tag.r { background:#fdeaea; color:#c74a44; }
  .tag.b { background:#e7f0fb; color:#2e5fa3; }
  .it { border:1px solid #eddfe7; border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .it .top { display:flex; justify-content:space-between; margin-bottom:4px; }
  .it b { color:#6d2a52; font-size:13.5px; }
  .it .meta { font-size:12.5px; color:#7a6470; line-height:1.7; }
  .ai-panel { position:sticky; top:16px; display:flex; flex-direction:column; height:calc(100vh - 32px); background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(14,77,69,.08); }
  .ai-head { background:linear-gradient(135deg,#6d2a52,#d16ba5); color:#fff; padding:14px 16px; }
  .ai-head b { font-size:15px; }
  .ai-head .sub { font-size:11px; opacity:.85; margin-top:3px; }
  .ai-body { flex:1; overflow-y:auto; padding:14px; font-size:13.5px; line-height:1.75; }
  .ai-body .msg { margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .ai-body .msg.user { background:#f7e9f1; border-radius:10px 10px 2px 10px; padding:8px 12px; margin-left:24px; color:#1f2a28; }
  .chips { padding:8px 14px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid #f2e4ec; }
  .chip { font-size:12px; background:#f7e9f1; color:#6d2a52; border:none; border-radius:14px; padding:5px 10px; cursor:pointer; }
  .chip:hover { background:#eed3e2; }
  .ai-input { display:flex; gap:8px; padding:10px 14px; border-top:1px solid #f2e4ec; }
  .ai-input input { flex:1; border:1px solid #ddc3d2; border-radius:8px; padding:9px 12px; font-size:13px; outline:none; }
  .ai-input input:focus { border-color:#d16ba5; }
  .ai-input button { background:#d16ba5; color:#fff; border:none; border-radius:8px; padding:0 18px; font-size:13px; cursor:pointer; }
  .ai-input button:disabled { background:#dca9c8; }
</style>
</head>
<body>
<header>
  <div>
    <h1>💐 AI 鲜花订阅管家台</h1>
    <div class="sub">套餐查询 · 花材养护 · 新建订阅 · 订单 · 配送 | 鲜花订阅云平台</div>
  </div>
  <div class="badge" id="topBadge">加载中…</div>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2>运营看板</h2>
      <div class="stat" id="stats"></div>
    </div>
    <div class="card">
      <h2>订阅实况</h2>
      <div id="cars"></div>
    </div>
    <div class="card">
      <h2>本期配送</h2>
      <div id="orders"></div>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-head">
      <b>💐 AI 鲜花订阅管家</b>
      <div class="sub">flower-copilot · 套餐 / 花材 / 订阅 / 订单 / 配送</div>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="chips">
      <button class="chip" onclick="ask('有哪些订阅套餐？')">订阅套餐</button>
      <button class="chip" onclick="ask('玫瑰的花语和养护方法')">花材养护</button>
      <button class="chip" onclick="ask('轻氧周刊多少钱？帮朋友了解一下')">套餐价格</button>
      <button class="chip" onclick="ask('本期的配送安排')">配送查询</button>
      <button class="chip" onclick="ask('订阅业务运营情况怎么样？')">运营看板</button>
    </div>
    <div class="ai-input">
      <input id="q" placeholder="例如：我想每周收一束花，哪个套餐合适？玫瑰怎么养？" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>
<script>
const j = r => Promise.resolve(r).then(resp => resp.json()).then(d => d.data ?? d);
const cTag = s => s==='生效中' ? '<span class="tag g">生效中</span>' : s==='已暂停' ? '<span class="tag y">已暂停</span>' : '<span class="tag b">已取消</span>';
const oTag = s => s==='待配送' ? '<span class="tag y">待配送</span>' : s==='配送中' ? '<span class="tag b">配送中</span>' : '<span class="tag g">已送达</span>';
async function load() {
  try {
    const st = await j(fetch('/api/stats'));
    document.getElementById('topBadge').textContent = `订阅 ${st.activeSubs} · 月流水 ¥${st.mrr}`;
    document.getElementById('stats').innerHTML = `
      <div><span>生效订阅</span><b>${st.activeSubs}</b></div>
      <div><span>月流水</span><b>¥${st.mrr}</b></div>
      <div><span>总订阅人</span><b>${st.totalSubscribers}</b></div>
      <div><span>待配送</span><b>${st.pendingDeliveries}</b></div>`;
    const cs = await j(fetch('/api/plans'));
    document.getElementById('cars').innerHTML = (cs.plans || cs).map(c => `
      <div class="it">
        <div class="top"><b>${c.id} · ${c.name}</b><span class="tag g">${c.freq}</span></div>
        <div class="meta">¥${c.price} · ${c.desc} · 已订 ${c.subscribers} 人</div>
      </div>`).join('');
    const ds = await j(fetch('/api/deliveries'));
    document.getElementById('orders').innerHTML = (ds.items || []).map(d => `
      <div class="it">
        <div class="top"><b>${d.id} · ${d.customer}</b>${oTag(d.status)}</div>
        <div class="meta">${d.bouquet} · ${d.slot}</div>
      </div>`).join('');
  } catch(e) { console.error(e); }
}
function ask(t) { const q=document.getElementById('q'); q.value=t; send(); }
async function send() {
  const inp = document.getElementById('q'), btn = document.getElementById('sendBtn');
  const text = inp.value.trim(); if (!text || btn.disabled) return;
  inp.value = ''; btn.disabled = true;
  const body = document.getElementById('aiBody');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text; body.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg'; a.textContent = '…'; body.appendChild(a);
  try {
    const resp = await fetch('/api/assistant/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        for (const line of p.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const dstr = line.slice(5).trim(); if (!dstr || dstr === '[DONE]') continue;
          try {
            const d = JSON.parse(dstr);
            const piece = d.content ?? d.delta ?? '';
            if (typeof piece === 'string' && piece) { out += piece; a.textContent = out; body.scrollTop = body.scrollHeight; }
          } catch(e) {}
        }
      }
    }
    if (!out) a.textContent = '（无返回内容）';
  } catch(e) { a.textContent = 'AI 服务暂时不可用：' + e.message; }
  btn.disabled = false; body.scrollTop = body.scrollHeight;
}
load();
</script>
</body>
</html>
